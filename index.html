<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskCal PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
    <link rel="apple-touch-icon" href="icon-192.png"> 
</head>
<body>

    <div class="container">
        <header>
            <div class="header-top">
                <h2>TaskCal</h2>
                <button id="settingsBtn" aria-label="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="#4a90e2">
                        <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                    </svg>
                </button>
            </div>
            
            <div class="month-nav">
                <button id="prevMonth">&lt;</button>
                <h3 id="monthYear"></h3>
                <button id="nextMonth">&gt;</button>
            </div>
        </header>

        <div class="calendar" id="calendar">
            </div>

        <hr>

        <div class="task-section">
            <h3 id="selectedDateLabel">Select a date</h3>
            
            <div class="input-group">
                <select id="priorityInput" class="priority-select medium">
                    <option value="low">Low</option>
                    <option value="medium" selected>Med</option>
                    <option value="high">High</option>
                </select>

                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button id="addTaskBtn">+</button>
            </div>

            <div class="recurrence-wrapper">
                <label class="recurrence-toggle">
                    <input type="checkbox" id="isRecurring"> 
                    <span>Repeat this task?</span>
                </label>

                <div id="recurrenceOptions" class="recurrence-options hidden">
                    <div class="row">
                        <label>Frequency:</label>
                        <select id="repeatFreq">
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                            <option value="custom">Custom Days</option>
                        </select>
                    </div>

                    <div id="customDaysSelector" class="custom-days hidden">
                        <div class="day-checkbox"><input type="checkbox" value="1" id="d-mon"><label for="d-mon">M</label></div>
                        <div class="day-checkbox"><input type="checkbox" value="2" id="d-tue"><label for="d-tue">T</label></div>
                        <div class="day-checkbox"><input type="checkbox" value="3" id="d-wed"><label for="d-wed">W</label></div>
                        <div class="day-checkbox"><input type="checkbox" value="4" id="d-thu"><label for="d-thu">T</label></div>
                        <div class="day-checkbox"><input type="checkbox" value="5" id="d-fri"><label for="d-fri">F</label></div>
                        <div class="day-checkbox"><input type="checkbox" value="6" id="d-sat"><label for="d-sat">S</label></div>
                        <div class="day-checkbox"><input type="checkbox" value="0" id="d-sun"><label for="d-sun">S</label></div>
                    </div>

                    <div class="row">
                        <label>Until:</label>
                        <input type="date" id="recurrenceEndDate">
                    </div>
                </div>
            </div>

            <ul id="activeTaskList" class="task-list"></ul>

            <div class="completed-section" id="completedSection" style="display: none;">
                <h4 id="completedHeader">Completed (0)</h4>
                <ul id="completedTaskList" class="task-list completed-list"></ul>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Data Management</h3>
                <button id="closeSettingsBtn">✕</button>
            </div>
            <div class="modal-body">
                <p>Backup your tasks to a file or restore from a previous backup.</p>
                
                <button id="exportBtn" class="action-btn download">⬇ Download Backup</button>
                
                <div class="import-wrapper">
                    <label for="importFile" class="action-btn upload">⬆ Restore Backup</label>
                    <input type="file" id="importFile" accept=".json">
                </div>
                
                <p class="warning-text">Note: Restoring will overwrite current data.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
